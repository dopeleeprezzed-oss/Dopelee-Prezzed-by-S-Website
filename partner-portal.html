<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
  }

  /* WEBSITE-STYLE HEADER - BLACK WITH BUBBLES */
  .header {
    background: #000;
    padding: 2rem 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-top: 2px solid #d4af37;
    border-bottom: 2px solid #d4af37;
  }
  
  /* Blue Bling Background Effect */
  .header::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    background: 
      radial-gradient(circle at 25% 35%, rgba(15, 240, 184, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 75% 65%, rgba(10, 149, 168, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(15, 240, 184, 0.1) 0%, transparent 60%);
    pointer-events: none;
    animation: heroBling 5s ease-in-out infinite;
  }
  
  @keyframes heroBling {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  
  /* Floating Colored Bubbles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.4;
    animation: bubbleRise 8s infinite ease-in-out;
    pointer-events: none;
    box-shadow: 0 0 30px currentColor, 0 0 60px currentColor, inset 0 0 20px rgba(255, 255, 255, 0.3);
    filter: blur(1px);
  }
  
  @keyframes bubbleRise {
    0% {
      transform: translateY(100vh) scale(0);
      opacity: 0;
    }
    10% {
      opacity: 0.6;
    }
    90% {
      opacity: 0.3;
    }
    100% {
      transform: translateY(-100px) scale(1);
      opacity: 0;
    }
  }
  
  .header .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; background: #0ff0b8; animation-delay: 0s; animation-duration: 10s; }
  .header .bubble:nth-child(2) { left: 25%; width: 60px; height: 60px; background: #d3fb1b; animation-delay: 2s; animation-duration: 12s; }
  .header .bubble:nth-child(3) { left: 45%; width: 50px; height: 50px; background: #fd26fd; animation-delay: 1s; animation-duration: 11s; }
  .header .bubble:nth-child(4) { left: 65%; width: 35px; height: 35px; background: #3461fa; animation-delay: 3s; animation-duration: 9s; }
  .header .bubble:nth-child(5) { left: 80%; width: 55px; height: 55px; background: #0a95a8; animation-delay: 4s; animation-duration: 13s; }
  
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }
  
  @keyframes logoGlow {

    50% { filter: drop-shadow(0 0 50px rgba(253, 38, 253, 0.8)) drop-shadow(0 0 80px rgba(52, 97, 250, 0.6)); }

  .logo-container {

    justify-content: center;
    gap: 15px;
    margin-bottom: 0.5rem;
    position: relative;

  .qr-buttons {

  /* ORDERS TABLE */

<script>
const SUPABASE_URL = 'https://dyehxtiozfwlexkbalvn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5ZWh4dGlvemZ3bGV4a2JhbHZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4NDYxMzMsImV4cCI6MjA4MTQyMjEzM30.dxd7otsV6WzD6dt41sWkYdseW94BRn0WI8MtFCqnAIs';
const SUPABASE_ANON_KEY = SUPABASE_KEY; // alias for compatibility
const LANDING_PAGE_BASE = 'https://www.dopeleeprezzedbys.com/partner-landing.html';

const urlParams = new URLSearchParams(window.location.search);
const partnerId = urlParams.get('partner');

if (!partnerId) {
  document.getElementById('content').innerHTML = `

// ═══════════════════════════════════════════════════════════
// CALCULATE TIER BASED ON TOTAL SALES
// ═══════════════════════════════════════════════════════════
function calculateTier(totalSales, partner = null) {
  // Custom partners have flat rate - no tiers
  if (partner && partner.partner_type === 'custom') {
    const rate = parseFloat(partner.commission_rate) || 0.13;
    return { 
      name: 'Preferred Partner', 
      rate: rate, 
      class: 'tier-preferred',
      isCustom: true,
      message: 'Thank you for being a valued partner.'
    };
  }
  
  // Standard tiered partners
  if (totalSales >= 10000) {
    return { 
      name: 'Legacy Partner', 
      rate: 0.18, 
      class: 'tier-legacy',
      min: 10000,
      message: 'You\'re moving volume. You understand the mission.'
    };
  } else if (totalSales >= 5000) {
    return { 
      name: 'Impact Partner', 
      rate: 0.15, 
      class: 'tier-impact',
      min: 5000,
      max: 9999,
      message: 'You\'re consistent. You\'re activating your audience.'
    };
  } else if (totalSales >= 2000) {
    return { 
      name: 'Growth Partner', 
      rate: 0.12, 
      class: 'tier-growth',
      min: 2000,
      max: 4999,
      message: 'You\'re in. You\'re learning. You\'re building.'
    };
  } else {
    return { 
      name: 'Foundation Partner', 
      rate: 0.10, 
      class: 'tier-foundation',
      min: 0,
      max: 1999,
      message: 'You\'re in. You\'re learning. You\'re building.'
    };
  }
}

// ═══════════════════════════════════════════════════════════
// LOAD PARTNER DASHBOARD
// ═══════════════════════════════════════════════════════════
async function loadPartnerDashboard() {
  try {
    const partnerResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/partners?partner_id=eq.${partnerId}&select=*`,
      {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );
    
    const partnerData = await partnerResponse.json();
    
    if (!partnerData || partnerData.length === 0) {
      showError('Partner not found. Please contact K.Smith at 816-530-1520');
      return;
    }
    
    const partner = partnerData[0];
    
    // Check if this is the PX partner - if so, pull from px_sales table
    const isPXPartner = partnerId === 'de71d40d-688c-4544-b0f7-215591adafb5' || 
                        partner.partner_id === 'de71d40d-688c-4544-b0f7-215591adafb5' || 
                        partner.business_name?.includes('Fort Leavenworth') || 
                        partner.business_name?.includes('Exchange Service') ||
                        partner.business_name?.includes('PX');
    
    let orders = [];
    
    if (isPXPartner) {
      // PX Partner - pull from px_sales table (all records) + products price list
      const [pxSalesResponse, pxProductsResponse] = await Promise.all([
        fetch(
          `${SUPABASE_URL}/rest/v1/px_sales?select=*&order=order_date.desc`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
        ),
        fetch(
          `${SUPABASE_URL}/rest/v1/products?show_on_website=eq.false&select=name,px_price,product_category,price_updated_at&order=product_category.asc,name.asc`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
        )
      ]);
      
      const pxSales = await pxSalesResponse.json() || [];
      const pxProducts = await pxProductsResponse.json() || [];
      
      renderPXDashboard(partner, pxSales, pxProducts);
      return;
    } else {
      // Regular partner - pull from orders table
      const ordersResponse = await fetch(
        `${SUPABASE_URL}/rest/v1/orders?partner_id=eq.${partnerId}&select=*&order=created_at.desc&limit=50`,
        {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        }
      );
      
      orders = await ordersResponse.json() || [];
    }
    
    renderDashboard(partner, orders);
    
  } catch (err) {
    console.error('Error:', err);
    showError('Error loading dashboard. Please try again or contact support at 816-530-1520');
  }
}

// ═══════════════════════════════════════════════════════════
// RENDER PX PARTNER DASHBOARD (CANDY)
// ═══════════════════════════════════════════════════════════
function renderPXDashboard(partner, sales, products) {
  const COMMISSION_RATE = 0.13;

  // ── BUILD AVAILABLE MONTHS from sales ──
  const monthSet = new Set();
  sales.forEach(s => {
    const d = new Date(s.order_date || s.created_at);
    if (!isNaN(d)) monthSet.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  });
  const monthKeys = [...monthSet].sort().reverse(); // newest first

  // Default to current month if it exists, else most recent

function renderPXMonthly(sales) {

  const COMMISSION_RATE = 0.13;

  // Filter sales for selected month
  const filtered = sales.filter(s => {
    const d = new Date(s.order_date || s.created_at);
    if (isNaN(d)) return false;
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return k === selectedKey;
  });

  // Summary totals — use actual commission_amount from database
  let monthNet = 0, monthGross = 0, monthCommission = 0;
  filtered.forEach(s => {
    const net = parseFloat(s.sale_amount) || 0;
    const tax = parseFloat(s.tax_amount) || 0;
    monthNet += net;
    monthGross += (net + tax); // Gross = what the customer actually paid (incl. tax)
    monthCommission += parseFloat(s.commission_amount) || 0; // use actual stored value

  // Summary HTML

function toggleAccordion(id) {
  const body = document.getElementById(id);
  const arrow = document.getElementById(id + '-arrow');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
}

  // Gather data from rendered accordion tables

    const header = div.previousElementSibling;
    const catName = header ? header.querySelector('span').textContent.replace(/\(\d+\)/, '').trim() : '';
    if (catName !== prevCat) {
      tableRows += `<tr class="cat-header"><td colspan="2">${catName}</td></tr>`;

      <p style="margin-bottom:15px;">You earn ${Math.round(tier.rate * 100)}% commission on every order.</p>
      ${tier.isCustom ? `
        <p style="background:rgba(15,240,184,0.1);border:2px solid #0ff0b8;padding:15px;margin:15px 0;border-radius:12px;text-align:center;">
          <strong style="color:#0ff0b8;font-size:18px;">✨ Preferred Partner Rate</strong><br>
          <span style="color:#b8bac0;font-size:14px;">You have a special flat commission rate.</span>
        </p>
      ` : nextTier ? `
        <p style="background:rgba(211,251,27,0.1);border-left:4px solid #d3fb1b;padding:12px;margin:15px 0;border-radius:8px;">
          <strong style="color:#d3fb1b;">Next Tier:</strong> Reach $${nextTier.min.toLocaleString()} in sales to unlock ${nextTier.name} status and earn ${Math.round(nextTier.rate * 100)}% commission!<br>
          <span style="font-size:14px;color:#b8bac0;">You're $${(nextTier.min - totalSales).toLocaleString()} away!</span>
        </p>
      ` : `
        <p style="background:rgba(211,251,27,0.2);border:2px solid #d3fb1b;padding:15px;margin:15px 0;border-radius:12px;text-align:center;">
          <strong style="color:#d3fb1b;font-size:18px;">🏆 Maximum Tier Achieved!</strong><br>
          <span style="color:#b8bac0;font-size:14px;">You're earning the highest commission rate!</span>
        </p>
      `}
      <div class="stats-row">
        <div class="stat-box">
          <h3>Total Earned</h3>
          <p>$${totalEarned.toFixed(2)}</p>
          <small>at ${Math.round(tier.rate * 100)}% rate</small>
        </div>
        <div class="stat-box">
          <h3>Total Sales</h3>
          <p>$${totalSales.toFixed(2)}</p>
          <small>${tier.isCustom ? 'Preferred Partner' : tier.name}</small>
        </div>
        <div class="stat-box">
          <h3>This Month</h3>
          <p>${thisMonthOrders}</p>
          <small>orders</small>
        </div>
        <div class="stat-box">
          <h3>All Time</h3>
          <p>${orders.length}</p>
          <small>orders</small>
        </div>
      </div>
      
      <!-- THIS MONTH BREAKDOWN -->
      <div style="background:rgba(211,251,27,0.1);border:1px solid rgba(211,251,27,0.3);border-radius:12px;padding:20px;margin-top:20px;">
        <h3 style="margin:0 0 15px;color:#d3fb1b;font-size:18px;">📅 This Month's Earnings</h3>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;text-align:center;">
          <div>
            <p style="margin:0;font-size:28px;font-weight:700;color:#d3fb1b;">$${thisMonthCommission.toFixed(2)}</p>
            <p style="margin:5px 0 0;font-size:13px;color:#b8bac0;">Commission Earned</p>
          </div>
          <div>
            <p style="margin:0;font-size:28px;font-weight:700;color:#0ff0b8;">$${thisMonthSales.toFixed(2)}</p>
            <p style="margin:5px 0 0;font-size:13px;color:#b8bac0;">In Sales</p>
          </div>
          <div>
            <p style="margin:0;font-size:28px;font-weight:700;color:#fff;">${thisMonthOrders}</p>
            <p style="margin:5px 0 0;font-size:13px;color:#b8bac0;">Orders</p>
          </div>
        </div>
      </div>
      
      <!-- PAYOUT STATUS -->
      <div style="background:rgba(52,97,250,0.1);border:1px solid rgba(52,97,250,0.3);border-radius:12px;padding:20px;margin-top:20px;">
        <h3 style="margin:0 0 15px;color:#3461fa;font-size:18px;">💵 Payout Status</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
          <div style="text-align:center;padding:15px;background:rgba(0,0,0,0.3);border-radius:10px;">
            <p style="margin:0;font-size:24px;font-weight:700;color:#fd26fd;">$${pendingCommission.toFixed(2)}</p>
            <p style="margin:5px 0 0;font-size:13px;color:#b8bac0;">Pending Payout</p>
          </div>
          <div style="text-align:center;padding:15px;background:rgba(0,0,0,0.3);border-radius:10px;">
            <p style="margin:0;font-size:24px;font-weight:700;color:#0ff0b8;">$${paidCommission.toFixed(2)}</p>
            <p style="margin:5px 0 0;font-size:13px;color:#b8bac0;">Already Paid</p>
          </div>
        </div>
        <p style="margin:15px 0 0;font-size:13px;color:#b8bac0;text-align:center;">
          💡 Commissions are paid monthly. Questions? Call <a href="tel:8165301520" style="color:#0ff0b8;">816-530-1520</a>
        </p>
      </div>
    </div>
  `;
  
  // ═══════════════════════════════════════════════════════════
  // QR CODE
  // ═══════════════════════════════════════════════════════════
  const isCustomPartner = partner.partner_type === 'custom';
  const landingPageUrl = isCustomPartner 
    ? 'https://www.dopeleeprezzedbys.com/PX-Landing.html'
    : `${LANDING_PAGE_BASE}?id=${partner.partner_id}`;
  const qrCodeUrl = partner.qr_code_url || generateQRCodeUrl(partner.partner_id);
  
  html += `
    <div class="card qr-box">
      <h2>📱 Your Customer QR Code</h2>
      <p style="margin-bottom:10px;">Share it everywhere — every order = ${Math.round(tier.rate * 100)}% for you!</p>
      <img src="${qrCodeUrl}" alt="QR Code" id="qrImage">
      <div class="qr-buttons">
        <button class="qr-btn" onclick="downloadQR()">⬇️ Download QR</button>
        <button class="qr-btn" onclick="copyLink('${landingPageUrl}')">📋 Copy Link</button>
      </div>
      <p style="font-size:12px;margin-top:15px;color:#666;word-break:break-all;">
        <a href="${landingPageUrl}" target="_blank" style="color:#0ff0b8;text-decoration:none;">${landingPageUrl}</a>
      </p>
    </div>
  `;
  
  // ═══════════════════════════════════════════════════════════
  // COLLAPSIBLE ORDERS
  // ═══════════════════════════════════════════════════════════
  html += `
    <div class="card">
      <div onclick="toggleOrders()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
        <h2 style="margin:0;">📦 Order Details</h2>
        <span id="ordersToggle" style="color:#0ff0b8;font-size:14px;">View Details ▼</span>
      </div>
      <div id="ordersContent" style="display:none;margin-top:20px;">
  `;
  
  if (orders.length > 0) {
    html += `
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Order #</th>
                <th>Date</th>
                <th>Total</th>
                <th>Commission</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
    `;
    
    orders.forEach(order => {
      const last4 = order.order_id ? order.order_id.slice(-4) : 'N/A';
      const date = order.created_at ? new Date(order.created_at).toLocaleDateString() : 'N/A';
      const total = parseFloat(order.order_total) || 0;
      const commission = total * tier.rate;
      const orderStatus = order.status || 'Processing';
      
      html += `
        <tr>
          <td>#${last4}</td>
          <td>${date}</td>
          <td style="font-weight:700">$${total.toFixed(2)}</td>
          <td style="color:#0ff0b8;font-weight:700">$${commission.toFixed(2)}</td>
          <td>${orderStatus}</td>
        </tr>
      `;
    });
    
    html += `
            </tbody>
          </table>
        </div>
    `;
  } else {
    html += `
        <p style="text-align:center;padding:30px 0;color:#666;font-size:15px;">
          No orders yet! Share your QR code to start earning. 💰
        </p>
    `;
  }
  
  html += `
      </div>
    </div>
  `;
  
  // FOOTER - MATCHES EMAIL FOOTER
  html += `
    <footer class="portal-footer">
      <div class="footer-container">
        
        <p class="footer-help">Need help? Contact us anytime!</p>
        
        <h3 class="footer-brand">Dopelee Prezzed by S™</h3>
        
        <p class="footer-contact">
          <a href="https://www.dopeleeprezzedbys.com" target="_blank">www.dopeleeprezzedbys.com</a><br>
          <a href="tel:816-530-1520">816-530-1520</a>
        </p>
        
        <div class="footer-social">
          <p class="social-label">Follow Us:</p>
          <div class="social-links">
            <a href="https://www.facebook.com/dopeleeprezzedbys" target="_blank">Facebook</a>
            <span class="separator">|</span>
            <a href="https://www.instagram.com/dopeleeprezzedbys" target="_blank">Instagram</a>
            <span class="separator">|</span>
            <a href="https://www.pinterest.com/dopeleeprezzedbys" target="_blank">Pinterest</a>
          </div>
        </div>
        
        <p class="footer-copyright">
         © ${new Date().getFullYear()} Dopelee Prezzed by S LLC<br>
          Creating legacy pieces with love and precision.
        </p>
        
      </div>
    </footer>
  `;
  
  document.getElementById('content').innerHTML = html;
}

function generateQRCodeUrl(partnerId) {
  const landingPageUrl = `${LANDING_PAGE_BASE}?id=${partnerId}`;
  return `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(landingPageUrl)}`;
}

function downloadQR() {
  const img = document.getElementById('qrImage');
  const link = document.createElement('a');
  link.href = img.src;
  link.download = `legacy-lounge-qr-${partnerId}.png`;
  link.click();
}

function copyLink(url) {
  const linkToCopy = url || `${LANDING_PAGE_BASE}?id=${partnerId}`;
  navigator.clipboard.writeText(linkToCopy).then(() => {
    alert('✅ Link copied to clipboard!');
  }).catch(() => {
    prompt('Copy this link:', linkToCopy);
  });
}

function toggleOrders() {
  const content = document.getElementById('ordersContent');
  const toggle = document.getElementById('ordersToggle');
  
  if (content.style.display === 'none') {
    content.style.display = 'block';
    toggle.textContent = 'Hide Details ▲';
  } else {
    content.style.display = 'none';
    toggle.textContent = 'View Details ▼';
  }
}

function showError(message) {
  document.getElementById('content').innerHTML = `
    <div class="error">
      <h2>⚠️ Error</h2>
      <p style="margin: 20px 0; font-size: 16px;">${message}</p>
      <p style="margin-top: 30px;">
        Need help? Call K.Smith: <a href="tel:8165301520">816-530-1520</a>
      </p>
    </div>
  `;
}
</script>

</body>
</html>
